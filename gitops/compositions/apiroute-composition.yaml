# APISIX Route Composition
# Creates ApisixRoute CRDs using Crossplane Kubernetes Provider
# Includes common plugin configurations (rate limiting, CORS, auth, etc.)
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: apiroute-apisix
  labels:
    crossplane.io/xrd: xapiroutes.gateway.crossplane.io
    provider: kubernetes
    gateway: apisix
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  compositeTypeRef:
    apiVersion: gateway.crossplane.io/v1alpha1
    kind: XAPIRoute
  
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # Resource 1: ApisixRoute - Main routing configuration
          - name: apisix-route
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                labels:
                  type: apisix-route
                  managed-by: crossplane
              spec:
                forProvider:
                  manifest:
                    apiVersion: apisix.apache.org/v2
                    kind: ApisixRoute
                    metadata:
                      namespace: default
                      labels:
                        managed-by: crossplane-composition
                        gateway: apisix
                    spec:
                      http:
                        - name: main-route
                          match:
                            paths:
                              - "/*"
                            methods:
                              - GET
                              - POST
                              - PUT
                              - DELETE
                          backends:
                            - serviceName: placeholder
                              servicePort: 80
                          plugins:
                            # Default plugins - always included
                            - name: prometheus
                              enable: true
                              config:
                                prefer_name: true
                providerConfigRef:
                  name: default
            patches:
              # Route name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.routeName
                toFieldPath: spec.forProvider.manifest.metadata.name
              # Route namespace (use same as upstream)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.upstreamNamespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              # HTTP route name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.routeName
                toFieldPath: spec.forProvider.manifest.spec.http[0].name
              # Path
              - type: FromCompositeFieldPath
                fromFieldPath: spec.path
                toFieldPath: spec.forProvider.manifest.spec.http[0].match.paths[0]
              # Upstream service name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.upstreamService
                toFieldPath: spec.forProvider.manifest.spec.http[0].backends[0].serviceName
              # Upstream service port
              - type: FromCompositeFieldPath
                fromFieldPath: spec.upstreamPort
                toFieldPath: spec.forProvider.manifest.spec.http[0].backends[0].servicePort

          # Resource 2: ApisixPluginConfig - Shared plugin configuration
          - name: apisix-plugin-config
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                labels:
                  type: apisix-plugin-config
                  managed-by: crossplane
              spec:
                forProvider:
                  manifest:
                    apiVersion: apisix.apache.org/v2
                    kind: ApisixPluginConfig
                    metadata:
                      namespace: default
                      labels:
                        managed-by: crossplane-composition
                    spec:
                      plugins:
                        # Prometheus metrics - always enabled
                        - name: prometheus
                          enable: true
                          config:
                            prefer_name: true
                        # Request ID for tracing
                        - name: request-id
                          enable: true
                          config:
                            include_in_response: true
                providerConfigRef:
                  name: default
            patches:
              # Plugin config name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.routeName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-plugins"
              # Namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.upstreamNamespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace

          # Resource 3: ConfigMap - Route metadata and documentation
          - name: route-metadata
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                labels:
                  type: route-metadata
                  managed-by: crossplane
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: default
                      labels:
                        managed-by: crossplane-composition
                        type: apisix-route-metadata
                    data:
                      ROUTE_NAME: ""
                      ROUTE_PATH: ""
                      UPSTREAM_SERVICE: ""
                      UPSTREAM_PORT: ""
                      MANAGED_BY: "crossplane-apisix-composition"
                      CREATED_AT: "gitops-deployment"
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.routeName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-route-metadata"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.upstreamNamespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.routeName
                toFieldPath: spec.forProvider.manifest.data.ROUTE_NAME
              - type: FromCompositeFieldPath
                fromFieldPath: spec.path
                toFieldPath: spec.forProvider.manifest.data.ROUTE_PATH
              - type: FromCompositeFieldPath
                fromFieldPath: spec.upstreamService
                toFieldPath: spec.forProvider.manifest.data.UPSTREAM_SERVICE

