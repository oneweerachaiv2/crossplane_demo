# Redis Application deployed via Crossplane
# This creates a Deployment and Service for Redis
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: redis-deployment
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: redis-app
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: redis-app
        template:
          metadata:
            labels:
              app: redis-app
          spec:
            containers:
              - name: redis
                image: redis:7-alpine
                ports:
                  - containerPort: 6379
  providerConfigRef:
    name: default
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: redis-service
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Service
      metadata:
        name: redis-app
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: redis-app
        ports:
          - port: 6379
            targetPort: 6379
  providerConfigRef:
    name: default

