# Echo Server Application deployed via Crossplane
# This creates a Deployment and Service for echo-server
# Added via GitOps to test ArgoCD + Crossplane workflow
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: echo-deployment
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: echo-app
        namespace: default
        labels:
          app: echo-app
          deployed-by: gitops
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: echo-app
        template:
          metadata:
            labels:
              app: echo-app
          spec:
            containers:
              - name: echo
                image: hashicorp/http-echo:latest
                args:
                  - "-text=Hello from GitOps! Deployed via ArgoCD + Crossplane"
                ports:
                  - containerPort: 5678
  providerConfigRef:
    name: default
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: echo-service
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Service
      metadata:
        name: echo-app
        namespace: default
        labels:
          app: echo-app
          deployed-by: gitops
      spec:
        type: ClusterIP
        selector:
          app: echo-app
        ports:
          - port: 80
            targetPort: 5678
  providerConfigRef:
    name: default

