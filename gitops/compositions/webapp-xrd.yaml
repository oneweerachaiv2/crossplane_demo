# WebApp CompositeResourceDefinition (XRD)
# This defines a custom API for deploying web applications
# Users can create WebApp claims with simple parameters
---
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xwebapps.demo.crossplane.io
spec:
  group: demo.crossplane.io
  names:
    kind: XWebApp
    plural: xwebapps
  claimNames:
    kind: WebApp
    plural: webapps
  
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Application parameters (simple interface for users)
                appName:
                  type: string
                  description: "Name of the application"
                image:
                  type: string
                  description: "Container image to deploy"
                replicas:
                  type: integer
                  default: 1
                  description: "Number of replicas"
                port:
                  type: integer
                  default: 80
                  description: "Container port"
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Environment variables"
                message:
                  type: string
                  default: "Hello from Crossplane Composition!"
                  description: "Welcome message for the app"
              required:
                - appName
                - image
            status:
              type: object
              properties:
                deploymentStatus:
                  type: string
                serviceEndpoint:
                  type: string

