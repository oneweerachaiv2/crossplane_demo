# Redis API Route Claim
# Uses the APIRoute Composition to create an APISIX route
# Routes to the redis service for caching operations
---
apiVersion: gateway.crossplane.io/v1alpha1
kind: APIRoute
metadata:
  name: redis-api-route
  namespace: default
  labels:
    team: platform
    environment: dev
    type: api-claim
spec:
  # Route identification
  routeName: redis-api
  
  # Path configuration
  path: /api/cache/*
  pathType: prefix
  
  # Upstream service configuration
  # Routes to the redis service
  upstreamService: redis
  upstreamPort: 6379
  upstreamNamespace: default
  
  # Allowed HTTP methods
  methods:
    - GET
    - POST
    - PUT
    - DELETE
  
  # Plugin configurations
  plugins:
    # Enable rate limiting - strict for cache operations
    rateLimit:
      enabled: true
      requestsPerSecond: 500
      burstSize: 1000
    
    # Enable CORS for frontend access
    cors:
      enabled: true
      allowOrigins: "http://localhost:3000,http://localhost:5173"
      allowMethods: "GET,POST,PUT,DELETE"
      allowHeaders: "Content-Type,Authorization"
      maxAge: 3600
    
    # Enable API key authentication for cache access
    apiKey:
      enabled: false
    
    # Proxy rewrite disabled
    proxyRewrite:
      enabled: false

